    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;headache-map&quot; style=&quot;color:var(--foreground);font-family:var(--font-sans);&quot;&gt;
  &lt;style&gt;
    #headache-map{display:grid;gap:16px}
    #headache-map .hm-layout{display:grid;grid-template-columns:minmax(270px,1.05fr) minmax(250px,.95fr);gap:18px;align-items:start}
    #headache-map .hm-figure{border:1px solid light-dark(#d7e5e8,#38505a);border-radius:22px;padding:18px;background:light-dark(#f7fbfc,#15272e);box-shadow:0 14px 35px light-dark(rgba(24,64,76,.10),rgba(0,0,0,.28))}
    #headache-map h2,#headache-map h3,#headache-map p{margin:0}
    #headache-map h2{font-size:var(--font-size-lg);font-weight:500}
    #headache-map h3{font-size:var(--font-size-base);font-weight:500}
    #headache-map .hm-sub{color:var(--muted-foreground);margin-top:4px}
    #headache-map .hm-tabs{display:flex;flex-wrap:wrap;gap:6px}
    #headache-map button{font:inherit;color:var(--foreground);background:transparent;border:1px solid var(--border);border-radius:999px;padding:7px 10px;cursor:pointer}
    #headache-map button[aria-pressed=&quot;true&quot;]{border-color:var(--viz-series-1);box-shadow:inset 0 0 0 1px var(--viz-series-1)}
    #headache-map svg{display:block;width:100%;height:auto;max-height:420px}
    #headache-map .body{fill:light-dark(#efc6a4,#bc805e);stroke:light-dark(#4f3a32,#f4d4bf);stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 5px 5px rgba(0,0,0,.12))}
    #headache-map .feature{fill:none;stroke:light-dark(#5a4036,#3b241d);stroke-width:1.8;stroke-linecap:round}
    #headache-map .pain{fill:light-dark(#ef4b55,#ff6b73);stroke:light-dark(#c92e3a,#ff9298);stroke-width:1.5;opacity:.48}
    #headache-map .pain-line{fill:none;stroke:light-dark(#e43d49,#ff6973);stroke-width:16;stroke-linecap:round;opacity:.62}
    #headache-map .side-label{fill:var(--muted-foreground);font-size:12px}
    #headache-map .hm-detail{display:grid;gap:12px}
    #headache-map .hm-row{padding-bottom:10px;border-bottom:1px solid var(--border)}
    #headache-map .hm-label{color:var(--muted-foreground);font-size:12px;margin-bottom:2px}
    #headache-map .hm-emergency{border-left:4px solid var(--destructive);padding:10px 12px;background:var(--muted);border-radius:4px}
    #headache-map .hm-emergency strong{font-weight:500}
    #headache-map .hm-note{font-size:12px;color:var(--muted-foreground)}
    @media(max-width:620px){#headache-map .hm-layout{grid-template-columns:1fr}#headache-map svg{max-height:340px}}
  &lt;/style&gt;
  &lt;header&gt;
    &lt;h2&gt;Headache pattern map&lt;/h2&gt;
    &lt;p class=&quot;hm-sub&quot;&gt;Select a type to compare its typical location and clinical pattern.&lt;/p&gt;
  &lt;/header&gt;
  &lt;div class=&quot;hm-tabs&quot; role=&quot;group&quot; aria-label=&quot;Headache type&quot;&gt;
    &lt;button type=&quot;button&quot; data-kind=&quot;tension&quot; aria-pressed=&quot;true&quot;&gt;Tension-type&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-kind=&quot;migraine&quot; aria-pressed=&quot;false&quot;&gt;Migraine&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-kind=&quot;cluster&quot; aria-pressed=&quot;false&quot;&gt;Cluster&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-kind=&quot;sinus&quot; aria-pressed=&quot;false&quot;&gt;Rhinosinusitis&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-kind=&quot;cervicogenic&quot; aria-pressed=&quot;false&quot;&gt;Cervicogenic&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-kind=&quot;occipital&quot; aria-pressed=&quot;false&quot;&gt;Occipital neuralgia&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-kind=&quot;moh&quot; aria-pressed=&quot;false&quot;&gt;Medication-overuse&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;hm-layout&quot;&gt;
    &lt;div class=&quot;hm-figure&quot;&gt;
      &lt;svg viewBox=&quot;0 0 500 390&quot; role=&quot;img&quot; aria-labelledby=&quot;hm-svg-title hm-svg-desc&quot;&gt;
        &lt;title id=&quot;hm-svg-title&quot;&gt;Typical pain distribution&lt;/title&gt;
        &lt;desc id=&quot;hm-svg-desc&quot;&gt;Front and side views of a head with highlighted areas changing by selected headache type.&lt;/desc&gt;
        &lt;text class=&quot;side-label&quot; x=&quot;125&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;FRONT&lt;/text&gt;&lt;text class=&quot;side-label&quot; x=&quot;375&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot;&gt;SIDE&lt;/text&gt;
        &lt;!-- Human anatomical mannequin: front bust --&gt;
        &lt;path class=&quot;body&quot; d=&quot;M67 374c2-35 18-54 54-65l5-33c-28-10-48-37-57-72-10-2-18-15-18-31 0-12 5-22 13-26-2-57 17-103 61-103s63 46 61 103c8 4 13 14 13 26 0 16-8 29-18 31-9 35-29 62-57 72l5 33c36 11 52 30 54 65z&quot;/&gt;
        &lt;path class=&quot;feature&quot; d=&quot;M82 139q20-13 39-2M129 137q20-11 39 2M87 153q14 8 28 0M136 153q14 8 28 0M124 158l-7 42 15 4M101 225q24 15 48 0M78 108q47-39 94 0M71 171q-12-10-14 4M179 171q12-10 14 4M100 270q25 14 50 0M95 314q30 26 60 0&quot;/&gt;
        &lt;circle cx=&quot;101&quot; cy=&quot;153&quot; r=&quot;3.5&quot; fill=&quot;#49332c&quot;/&gt;&lt;circle cx=&quot;150&quot; cy=&quot;153&quot; r=&quot;3.5&quot; fill=&quot;#49332c&quot;/&gt;
        &lt;!-- Human anatomical mannequin: side bust --&gt;
        &lt;path class=&quot;body&quot; d=&quot;M294 374c1-31 18-52 53-64l3-45c-27-18-46-48-52-83-10-4-15-16-13-29 2-13 9-22 18-24 4-51 31-86 75-86 43 0 70 33 74 84 0 10 2 20 8 29l13 20-19 13c-1 34-15 58-43 72l3 49c35 12 52 33 53 64z&quot;/&gt;
        &lt;path class=&quot;feature&quot; d=&quot;M394 137q20-10 37 4M403 153q14 7 25-1M450 158l18 19-18 10M437 218q12 8 23-1M302 151q-13 5-12 21M317 105q49-35 112-2M339 267q31 17 65 1M333 315q35 23 73 0&quot;/&gt;
        &lt;circle cx=&quot;416&quot; cy=&quot;153&quot; r=&quot;3.5&quot; fill=&quot;#49332c&quot;/&gt;
        &lt;g id=&quot;hm-pain&quot;&gt;&lt;/g&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
    &lt;section class=&quot;hm-detail&quot; aria-live=&quot;polite&quot;&gt;
      &lt;h3 id=&quot;hm-name&quot;&gt;Tension-type headache&lt;/h3&gt;
      &lt;div class=&quot;hm-row&quot;&gt;&lt;div class=&quot;hm-label&quot;&gt;Typical location&lt;/div&gt;&lt;p id=&quot;hm-location&quot;&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;hm-row&quot;&gt;&lt;div class=&quot;hm-label&quot;&gt;Pain quality and duration&lt;/div&gt;&lt;p id=&quot;hm-quality&quot;&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;hm-row&quot;&gt;&lt;div class=&quot;hm-label&quot;&gt;Distinguishing clues&lt;/div&gt;&lt;p id=&quot;hm-clues&quot;&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;hm-row&quot;&gt;&lt;div class=&quot;hm-label&quot;&gt;Common aggravators or associations&lt;/div&gt;&lt;p id=&quot;hm-associated&quot;&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;hm-emergency&quot;&gt;&lt;strong&gt;Urgent assessment:&lt;/strong&gt; sudden “worst-ever” onset; new weakness, numbness, confusion, seizure, fainting or major visual change; fever with neck stiffness; new headache during pregnancy/postpartum; after significant trauma; or a new/progressive pattern after age 50.&lt;/div&gt;
      &lt;p class=&quot;hm-note&quot;&gt;Location overlaps substantially among disorders. Diagnose from the whole pattern, examination and red-flag assessment—not the map alone.&lt;/p&gt;
    &lt;/section&gt;
  &lt;/div&gt;
  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;headache-map&#x27;);
    const pain=root.querySelector(&#x27;#hm-pain&#x27;);
    const data={
      tension:{name:&#x27;Tension-type headache&#x27;,location:&#x27;Usually bilateral: forehead, temples, scalp, and sometimes the back of the head or neck—often described as a band.&#x27;,quality:&#x27;Pressing or tightening, non-pulsating, mild to moderate; 30 minutes to 7 days.&#x27;,clues:&#x27;Not worsened by routine activity. No vomiting; may have either light or sound sensitivity, but typically not both.&#x27;,associated:&#x27;Stress, fatigue, sleep disruption, prolonged posture, and pericranial muscle tenderness.&#x27;,shapes:&#x27;&lt;path class=&quot;pain-line&quot; d=&quot;M49 130q76-58 152 0&quot;/&gt;&lt;path class=&quot;pain-line&quot; d=&quot;M286 125q77-55 151 5&quot;/&gt;&lt;path class=&quot;pain&quot; d=&quot;M313 259h91v72h-91z&quot;/&gt;&#x27;},
      migraine:{name:&#x27;Migraine&#x27;,location:&#x27;Often unilateral frontotemporal pain, but may be bilateral or switch sides. It can extend behind the eye or into the neck.&#x27;,quality:&#x27;Pulsating or throbbing, moderate to severe; typically 4–72 hours untreated in adults.&#x27;,clues:&#x27;Worsened by activity, with nausea/vomiting or both light and sound sensitivity. Aura may cause reversible visual, sensory, or speech symptoms.&#x27;,associated:&#x27;Sleep change, stress, missed meals, menstruation, alcohol, and individual triggers.&#x27;,shapes:&#x27;&lt;path class=&quot;pain&quot; d=&quot;M34 115q5-67 91-72v177q-76-1-91-105z&quot;/&gt;&lt;path class=&quot;pain&quot; d=&quot;M271 113q13-62 94-70v182q-83-15-94-112z&quot;/&gt;&#x27;},
      cluster:{name:&#x27;Cluster headache&#x27;,location:&#x27;Strictly unilateral around or above one eye and the temple; generally the same side within a cluster period.&#x27;,quality:&#x27;Excruciating, piercing or boring; 15–180 minutes, occurring up to several times daily in clusters.&#x27;,clues:&#x27;Same-side tearing/red eye, stuffy or runny nose, eyelid swelling/droop, facial sweating; marked restlessness or pacing.&#x27;,associated:&#x27;Attacks may follow a clock-like pattern. Alcohol can trigger attacks during an active cluster period.&#x27;,shapes:&#x27;&lt;ellipse class=&quot;pain&quot; cx=&quot;82&quot; cy=&quot;153&quot; rx=&quot;36&quot; ry=&quot;30&quot;/&gt;&lt;ellipse class=&quot;pain&quot; cx=&quot;414&quot; cy=&quot;154&quot; rx=&quot;38&quot; ry=&quot;31&quot;/&gt;&#x27;},
      sinus:{name:&#x27;Acute rhinosinusitis headache&#x27;,location:&#x27;Pressure or pain over the forehead, cheeks, bridge of nose, or upper teeth—corresponding to inflamed sinuses.&#x27;,quality:&#x27;Deep pressure or facial aching occurring with an acute sinus illness.&#x27;,clues:&#x27;Purulent nasal discharge/obstruction, reduced smell, facial tenderness, fever or illness symptoms. “Sinus headache” without these features is often migraine.&#x27;,associated:&#x27;Usually follows a viral upper-respiratory infection; bacterial disease is suggested by persistent, severe, or double-worsening symptoms.&#x27;,shapes:&#x27;&lt;ellipse class=&quot;pain&quot; cx=&quot;125&quot; cy=&quot;105&quot; rx=&quot;45&quot; ry=&quot;23&quot;/&gt;&lt;ellipse class=&quot;pain&quot; cx=&quot;84&quot; cy=&quot;183&quot; rx=&quot;30&quot; ry=&quot;32&quot;/&gt;&lt;ellipse class=&quot;pain&quot; cx=&quot;166&quot; cy=&quot;183&quot; rx=&quot;30&quot; ry=&quot;32&quot;/&gt;&lt;ellipse class=&quot;pain&quot; cx=&quot;414&quot; cy=&quot;178&quot; rx=&quot;35&quot; ry=&quot;42&quot;/&gt;&#x27;},
      cervicogenic:{name:&#x27;Cervicogenic headache&#x27;,location:&#x27;Usually begins in the upper neck or occiput and radiates toward one side of the temple, forehead or eye.&#x27;,quality:&#x27;Non-throbbing, typically unilateral; duration varies with the underlying cervical disorder.&#x27;,clues:&#x27;Reduced neck range of motion; provoked by neck movement, sustained posture, or pressure over cervical structures.&#x27;,associated:&#x27;Cervical joint, disc, muscular, or other neck pathology. Confirming causation requires clinical assessment.&#x27;,shapes:&#x27;&lt;path class=&quot;pain-line&quot; d=&quot;M397 320q-4-74 22-106q13-16 18-42&quot;/&gt;&lt;path class=&quot;pain-line&quot; d=&quot;M163 322q-3-51 1-70&quot;/&gt;&#x27;},
      occipital:{name:&#x27;Occipital neuralgia&#x27;,location:&#x27;Back of the head along the greater, lesser or third occipital nerve; may shoot toward the crown or behind the eye.&#x27;,quality:&#x27;Brief, severe shooting, stabbing or electric-shock pains, with aching between attacks.&#x27;,clues:&#x27;Scalp sensitivity or altered sensation; tenderness and trigger points where the nerve emerges.&#x27;,associated:&#x27;May be idiopathic or related to irritation/entrapment; distinguish from pain referred from upper cervical joints or muscles.&#x27;,shapes:&#x27;&lt;path class=&quot;pain-line&quot; d=&quot;M289 213q-12-100 50-151&quot;/&gt;&lt;path class=&quot;pain-line&quot; d=&quot;M303 232q8-81 57-151&quot;/&gt;&lt;path class=&quot;pain&quot; d=&quot;M72 86q53-57 106 0l-15 48q-38-28-76 0z&quot;/&gt;&#x27;},
      moh:{name:&#x27;Medication-overuse headache&#x27;,location:&#x27;Often diffuse or bilateral; the location and quality may vary because it develops on top of a pre-existing headache disorder.&#x27;,quality:&#x27;Headache on 15 or more days per month in someone regularly overusing acute headache medication for more than 3 months.&#x27;,clues:&#x27;Increasing headache frequency and decreasing medication effectiveness; phenotype may resemble migraine or tension-type headache.&#x27;,associated:&#x27;Risk depends on medication class and days used. Withdrawal and prevention planning should be clinician-guided.&#x27;,shapes:&#x27;&lt;ellipse class=&quot;pain&quot; cx=&quot;125&quot; cy=&quot;146&quot; rx=&quot;86&quot; ry=&quot;101&quot;/&gt;&lt;ellipse class=&quot;pain&quot; cx=&quot;363&quot; cy=&quot;146&quot; rx=&quot;87&quot; ry=&quot;101&quot;/&gt;&#x27;}
    };
    function show(kind){const d=data[kind];pain.innerHTML=d.shapes;[&#x27;name&#x27;,&#x27;location&#x27;,&#x27;quality&#x27;,&#x27;clues&#x27;,&#x27;associated&#x27;].forEach(k=&gt;root.querySelector(&#x27;#hm-&#x27;+k).textContent=d[k]);root.querySelectorAll(&#x27;button[data-kind]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.kind===kind)));}
    root.querySelectorAll(&#x27;button[data-kind]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;show(b.dataset.kind)));
    show(&#x27;tension&#x27;);

  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;

      getContent(trigger).length === 0 ||
